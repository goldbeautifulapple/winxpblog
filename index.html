<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>TheGolden</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.staticfile.org/highlight.js/11.9.0/styles/github.min.css">
    </head>
    <body>
        <div class="desktop">
            <div class="icon">
                <div class="icon-img folder"></div>
                <div class="icon-name">Web笔记</div>
            </div>
            <div class="icon">
                <div class="icon-img folder"></div>
                <div class="icon-name">漏洞复现记录</div>
            </div>
            <div class="icon">
                <div class="icon-img gmod"></div>
                <div class="icon-name">gar'smod</div>
            </div>
        </div>

        <div class="window">
            <div class="titlebar">
                <span>TheGolden的个人博客</span>
                <span class="btns">
                    <span class="btn">_</span>
                    <span class="btn">□</span>
                    <span class="btn btn-close">×</span>
                </span>
            </div>
            <div class="window-body">
                <h1>网站简介</h1>
                <p>这是我的个人博客，可能比较简陋</p>
                <ul>
                    <li>
                        正在学web和c++
                    </li>
                    <li>
                        你可以通过右下角来缩放窗口
                    </li>
                    <li>
                        我的学习进展在《web笔记》
                    </li>
                </ul>
            </div>
        </div>
        <div class="taskbar">
            <div class="start-btn">
                <span class="start-flag">
                    <i></i><i></i><i></i><i></i></span>
                <span>开始</span>
            </div>
            <div class="task-list"></div>
            <div class="tray">
                <span id="clock">--:--</span>
            </div>
        </div>
        <script src="https://cdn.staticfile.org/marked/12.0.2/marked.min.js"></script>
        <script src="https://cdn.staticfile.org/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="js/window.js"></script>
        <script src="js/notes.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
